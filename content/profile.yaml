skills:
  # Levels set 18 Sep 2026 against the evidence actually on file. Years are
  # filled only where they follow from the employment dates; the rest are
  # TODO(owner) rather than estimated.
  - name: Python
    level: working
    evidence: >-
      Wrote a Python tool at Capgemini that used an LLM to prepare Active
      Directory account and access changes, which I reviewed before they were
      applied. It saved roughly 2 to 5 hours of my own time a week. I was its
      only user and it was retired when I left. Two ML assignments on real data:
      delivery-time regression over 175,777 rows and an EDA over 3,014,248 rows.
      Two classification case studies on synthetic data: insurance fraud on
      1,000 claims and employee retention on 74,610 records.

  - name: Pandas / NumPy
    level: working
    evidence: >-
      Cleaning and feature engineering on all four Python case studies,
      including reducing a 3,014,248 row taxi dataset to 489,542 usable rows,
      and recomputing the results of the crop insurance SQL analysis in pandas
      to check them.

  - name: Scikit-learn
    level: working
    evidence: >-
      Linear regression pipeline on Porter delivery data: 175,777 rows, an 80/20
      split, Recursive Feature Elimination from 12 features to 8, R squared of
      0.8737 and MAE of 2.45 minutes on scaled features. Logistic regression
      with RFECV against a grid-searched random forest for insurance fraud
      (validation F1 0.729, AUC 0.855), and logistic regression with RFE for
      employee retention (validation accuracy 0.739, AUC 0.825), each with its
      cutoff chosen from the sensitivity and specificity curves.

  - name: SQL
    level: working
    evidence: >-
      Database Management Systems (LCSCI7228) on the MSc: took business rules
      through an ER model to a relational schema in SQL, normalised to 3NF, then
      wrote eight queries of varying complexity and added indexes tested against
      sample queries. The schema and the query set both scored full marks. On
      the upGrad and IIIT Bangalore programme: 29 MySQL queries on India's PMFBY
      crop insurance data, using joins, subqueries, CTEs, window functions,
      constraints and indexes, with the results recomputed in pandas to check
      them.

  - name: NLP
    level: familiar
    evidence: >-
      IIIT Bangalore Advanced Certificate in Data Science with a specialisation
      in Natural Language Processing, awarded 28 October 2025. Coursework rather
      than shipped work.
