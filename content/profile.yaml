projects:
  - name: LR_Delivery_Time_Prediction
    one_liner: >-
      Delivery-time regression over 175,777 orders. All 12 features scored test
      R² 0.8800; eliminating four of them cost six points of R², which is the
      opposite of what the brief expected.
    repo: https://github.com/Shubham-afk-del/LR_Delivery_Time_Prediction_-Shubham-Kumar-Singh-
    stack: [Python, Pandas, NumPy, Scikit-learn, Matplotlib]
    case_study: content/case-studies/delivery-time-prediction.md
    metrics:
      - { label: orders, value: "175,777" }
      - { label: test R², value: "0.8800" }
      - { label: MAE, value: "2.33 min" }
  - name: EDA_Optimising_NYC_Taxis
    one_liner: >-
      Exploratory analysis of 489,542 taxi trips sampled across all twelve months
      of 2023. Tipping is highest between 10pm and 2am and on card rather than
      cash. Three figures in the submitted notebook turned out to be plotted from
      placeholder random data; the corrections are published alongside it.
    repo: https://github.com/Shubham-afk-del/EDA_Optimising_NYC_Taxis_Shubham_Kumar_Singh
    stack: [Python, Pandas, Matplotlib]
    case_study: content/case-studies/nyc-taxis-eda.md
    metrics:
      - { label: trips analysed, value: "489,542" }
      - { label: sampled from, value: "3,014,248/mo" }
      - { label: figures withdrawn, value: "3" }
  - name: Notes_App_AE2
    one_liner: >-
      Notes application built for the Web Services module of the MSc, in plain
      JavaScript. University coursework rather than production work.
    repo: https://github.com/Shubham-afk-del/Notes_App_AE2
    stack: [JavaScript]
  # Added 15 Oct 2026 from each repository's README, which quotes the executed
  # notebook outputs. Case studies from the upGrad and IIIT Bangalore Data
  # Science Programme.
  - name: Fraudulent_Claim_Detection
    one_liner: >-
      Fraud detection on 1,000 synthetic auto insurance claims with a 24.7%
      fraud rate, from the upGrad and IIIT Bangalore Data Science Programme. A
      six-feature logistic regression caught 84% of frauds at 85% specificity
      on held-out claims (F1 0.729, AUC 0.855) and beat a tuned random forest,
      which overfit the oversampled training set, on every validation metric.
      The strongest feature is a label leak in the synthetic data, and the
      write-up says so.
    repo: https://github.com/Shubham-afk-del/Fraudulent_Claim_Detection
    stack: [Python, Pandas, Scikit-learn, statsmodels, imbalanced-learn]
    metrics:
      - { label: claims, value: "1,000" }
      - { label: validation F1, value: "0.729" }
      - { label: AUC, value: "0.855" }
  - name: Predicting_Employee_Retention
    one_liner: >-
      Logistic regression on 74,610 employee records to predict who stays, from
      the upGrad and IIIT Bangalore Data Science Programme. On 21,168 held-out
      employees it recognised 74.0% of those who stayed and 73.9% of those who
      left (accuracy 0.739, AUC 0.825). Seniority and remote work mattered
      most: senior staff have 12.05 times the odds of staying of entry-level
      staff, and remote workers 5.62 times.
    repo: https://github.com/Shubham-afk-del/Predicting_Employee_Retention
    stack: [Python, Pandas, Scikit-learn, statsmodels]
    metrics:
      - { label: employees, value: "74,610" }
      - { label: validation accuracy, value: "0.739" }
      - { label: AUC, value: "0.825" }
  - name: SQL_Farmers_Insurance_Analysis
    one_liner: >-
      29 MySQL queries on India's PMFBY crop insurance scheme, over 1,870
      district-year records from 2018 to 2021, from the upGrad and IIIT
      Bangalore Data Science Programme: joins, subqueries, CTEs, window
      functions, constraints and indexes. Farmers paid 13.1% of the gross
      premium, a share that fell every year from 19.1% in 2018 to 10.6% in 2021.
    repo: https://github.com/Shubham-afk-del/SQL_Farmers_Insurance_Analysis
    stack: [MySQL]
    metrics:
      - { label: queries, value: "29" }
      - { label: district-year records, value: "1,870" }
  - name: This assistant
    one_liner: >-
      This site. A retrieval-grounded assistant that answers recruiters'
      questions about my work from my own documents and shows the passages each
      answer drew on: hybrid search (Voyage embeddings and BM25), an LLM
      reranker with a relevance gate, a separate check that declines general
      questions, and a set of test questions it is measured against before
      every release.
    repo: https://github.com/Shubham-afk-del/portfolio-assistant
