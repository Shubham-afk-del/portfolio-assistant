  - name: Retrieval-augmented generation (RAG)
    level: working
    evidence: >-
      Building this assistant, a working RAG pipeline: hybrid keyword (BM25) and
      semantic search fused with reciprocal rank fusion, an LLM reranker, and
      answers written only from the retrieved passages. An evaluation harness
