summary: >-
  I spent three years in enterprise IT operations at Capgemini and Tech Mahindra,
  handling 50 or more incidents a day and administering Active Directory and
  endpoint compliance. Near the end of that I built a Python tool that used a
  language model to turn access requests into concrete proposed changes for me to
  approve, and that is where the interest in AI systems started. I'm now doing an
  MSc in Artificial Intelligence and Computer Science at Northeastern University
  London, with an NLP specialisation from IIIT Bangalore completed in October
  2025. I have not shipped machine learning in a production role, so this
  assistant is the work sample: built in the open, with its retrieval quality
  measured rather than asserted.

