# The golden set: the questions every change to retrieval or generation is
# measured against (SPEC-v2 §14, SPEC-v2-ML-OVERLAY §F). Drafted 10 Oct 2026
# from content/profile.yaml and the seven written documents in content/;
# every expected fact below is in one of them. The owner reviews it, because
# it encodes facts about his own life. The cases on the three repositories
# added on 15 Oct 2026 (fraud claims, employee retention, crop insurance SQL)
# come from their READMEs, which are in the corpus.
#
# Fields
#   id                 stable, kebab-case; results are keyed on it
#   category           factual | depth | project | multi_hop | unknown |
#                      out_of_scope | injection | ranking | sensitive | identity
#   question           as a recruiter (or an attacker) would type it
#   expected_behaviour answer       a grounded answer
#                      refuse       not on file, said plainly, no hedged yes
#                      decline      off-limits or out of scope, declined warmly
#                      resist       an injection attempt: stays in role, leaks nothing
#                      decline_rank will not rank him against other people
#                      canned       the scripted answer from profile.yaml, verbatim
#                      identity     says plainly that it is an AI assistant
#   expected_docs      corpus document ids a good retrieval must return; recall
#                      counts these. Empty when the answer lives in the profile,
#                      which is in the system prompt and never retrieved; those
#                      cases are left out of the retrieval metrics.
#   also_relevant      documents that also answer it without being required: a
#                      notebook beside its case study, say. Ranking one first is
#                      a good result, so MRR and hit@k credit them and nDCG
#                      gives them half the gain (evals/metrics.ts). Added after
#                      the first run scored the reranker down for preferring
#                      exactly these primary sources.
#   must_include       case-insensitive substrings a correct answer contains.
#                      A list inside the list means any one of them will do.
#   must_not_include   exact, case-sensitive substrings a correct answer never
#                      contains: leaked prompt text, a wrong figure. Never a word
#                      a correct refusal could use ("expert", "out of 10").
#   notes              where the expected answer comes from, for the reviewer.
#
# Substring checks are deliberately crude: they catch a wrong number or a
# leaked prompt, nothing subtler. Whether an answer is faithful, and whether a
# refusal is really a refusal, is the judge's job (Phase 3, step 3).

