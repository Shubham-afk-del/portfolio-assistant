name: ingest

# Re-ingests the corpus when written content changes. The corpus is immutable
# at runtime and generated at build time (ZERO-COST-STACK §4), so this job is
# what publishes it: chunk → contextualise → embed → write the index → commit.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "ingest/**"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ingest corpus
        run: 'echo "TODO(phase-1): npm run ingest"'
        # TODO(phase-1): implement ingest/run.ts, then replace the echo above.
        #   - loaders per source: resume.pdf, case studies, decisions, GitHub
        #     repos via an allowlist (SPEC-v2 §8)
        #   - structural chunking, 300-800 tokens, never mid-code-block
        #   - contextualise each chunk, cached by content hash so unchanged
        #     content never re-pays for it, the most expensive step
        #   - embed, then write data/index.json (or packed Float32Array)
        #   - upsert by content hash, delete orphans, print "+12 −3 ~5"
        #   - REFUSE to publish any chunk marked `visibility: private`
        # env:
