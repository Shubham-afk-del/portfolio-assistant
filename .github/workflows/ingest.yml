name: ingest

# The corpus index (data/index.json) is built locally with `npm run ingest`
# and committed: building it calls Voyage and Groq on free tiers, and the
# serverless function loads the committed file (ZERO-COST-STACK §4). This job
# checks that the committed index is current with content/, so a written
# document cannot change while the index the assistant answers from stays as
# it was. It needs no keys.
on:
  pull_request:
    paths:
      - "content/**"
      - "data/index.json"
      - "ingest/**"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "data/index.json"
      - "ingest/**"
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: index is current with content/
        run: npm run index:check
