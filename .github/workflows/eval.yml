name: eval

# The eval gate. This is the job that makes the repo worth reading: it fails on
# a measured regression rather than on a broken build (SPEC-v2-ML-OVERLAY §F).
on:
  pull_request:
  schedule:
    # Nightly, off-peak. Free-tier RPD caps make eval runs the real constraint
    # (ZERO-COST-STACK §6), so the full sweep runs overnight, not per push.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

