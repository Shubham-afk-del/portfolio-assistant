name: eval

# What CI can check about the evals without API keys. The measured runs
# (npm run eval, npm run eval:answers) call three free-tier APIs and spend the
# same daily quota the live site answers from, so they run locally before a
# release, and their results are committed in evals/results.json and quoted
# in the README. Here: the golden set is valid against the committed index
# (every expected document exists, behaviours agree with categories, the case
# floor holds), and the metric and rate-limit tests pass.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: golden set is valid against the committed index
        run: npm run eval:check

      - name: unit tests
        run: npm test
